<!DOCTYPE html>
<html>
<head>
    <title>Mpesa Payment Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class='auth-container'>
    <form id="pay-form">
        <input type="tel" placeholder="Enter number 2547..." name="number" required>
        <br><br>
        <input type="number" placeholder="Enter amount" name="amount" required>
        <br><br><br>
        <button type="submit">Pay</button>
    </form>

    <div id="payment-status" style="margin-top:20px; color:blue;"></div>
</div>

<script>
const form = document.getElementById('pay-form');
const statusDiv = document.getElementById('payment-status');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    statusDiv.textContent = "Initiating payment...";

    const formData = new FormData(form);
    const payload = {
        number: formData.get('number'),
        amount: formData.get('amount')
    };

    try {
        const response = await fetch('/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
    statusDiv.textContent = "Payment initiated. Waiting for confirmation...";

    const interval = setInterval(async () => {
        const res = await fetch('/status');
        const s = await res.json();
        if (s.status && s.status !== "Pending") {
            statusDiv.textContent = s.status;

            if (s.status.toLowerCase().includes("successful")) {
                clearInterval(interval);
                setTimeout(() => window.location.href = "/success", 2000);
            } else {
                clearInterval(interval); // failed or cancelled
            }
        }
    }, 3000); // poll every 3 seconds
} catch (err) {
        console.error(err);
        statusDiv.textContent = "Error initiating payment.";
    }
});
</script>

</body>
</html>
