<!DOCTYPE html>
<html>
<head>
    <title>M-Pesa Payment Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class='auth-container'>
    <h1>Pay with M-Pesa</h1>
    <form id="pay-form">
        <input type="tel" placeholder="Enter number 2547..." name="number" required>
        <br>
        <input type="number" placeholder="Enter amount" name="amount" required>
        <br>
        <button type="submit">Pay</button>
    </form>

    <div id="payment-status"></div>
</div>

<script>
const form = document.getElementById('pay-form');
const statusDiv = document.getElementById('payment-status');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const payload = {
        number: formData.get('number'),
        amount: formData.get('amount')
    };

    statusDiv.textContent = "Initiating payment...";
    statusDiv.className = 'pending';

    try {
        const response = await fetch('/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!data.success) {
            statusDiv.textContent = `Payment failed: ${data.message}`;
            statusDiv.className = 'error';
            return;
        }

        statusDiv.textContent = "Payment initiated, waiting for confirmation...";
        statusDiv.className = 'pending';

        const interval = setInterval(async () => {
            const res = await fetch('/status');
            const s = await res.json();

            if (s.status && s.status !== 'Pending') {
                statusDiv.textContent = s.status;

                if (s.status.toLowerCase().includes('successful')) {
                    statusDiv.className = 'success';
                    clearInterval(interval);
                    setTimeout(() => window.location.href = '/success', 2000);
                } else {
                    statusDiv.className = 'error';
                    clearInterval(interval);
                }
            }
        }, 3000);

    } catch (err) {
        console.error(err);
        statusDiv.textContent = "Error initiating payment.";
        statusDiv.className = 'error';
    }
});
</script>

</body>
</html>
